name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # pixi.toml targets linux-64 only, so CI runs on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Only the CPU 'default' env; 'bench' needs a CUDA GPU.
          environments: default
          cache: true

      - name: Lint
        run: pixi run -e default lint

      - name: Format
        run: pixi run -e default format-check

      - name: Run tests
        run: pixi run -e default test
